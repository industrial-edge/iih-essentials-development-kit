<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="IIH Essentials example website icon">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#009999"/>
            <stop offset="1" stop-color="#005159"/>
        </linearGradient>
    </defs>

    <!-- Rounded background tile in IIH Essentials brand teal -->
    <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)"/>

    <!-- Information hub: a central node connected to surrounding data nodes -->
    <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
        <line x1="32" y1="32" x2="16" y2="16"/>
        <line x1="32" y1="32" x2="48" y2="16"/>
        <line x1="32" y1="32" x2="16" y2="48"/>
        <line x1="32" y1="32" x2="48" y2="48"/>
    </g>

    <g fill="#ffffff">
        <circle cx="16" cy="16" r="5"/>
        <circle cx="48" cy="16" r="5"/>
        <circle cx="16" cy="48" r="5"/>
        <circle cx="48" cy="48" r="5"/>
    </g>

    <!-- Central hub node accented with the brand teal -->
    <circle cx="32" cy="32" r="9" fill="#ffffff"/>
    <circle cx="32" cy="32" r="4" fill="#009999"/>
</svg>
